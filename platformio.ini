; Commute traffic display for M5StickC Plus2 (ESP32-PICO-V3-02, 8MB flash, PSRAM)
; Build:   python -m platformio run
; Flash:   python -m platformio run -t upload --upload-port COM4
; Monitor: python -m platformio device monitor -p COM4

[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps =
    m5stack/M5Unified
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=0
